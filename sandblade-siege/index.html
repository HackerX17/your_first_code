<title>Sandblade Siege</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c9a27a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: top-down fortress maze on one canvas; HUD tug-of-war bar on top, menus as bottom overlays. Single warm desert look in every theme. */
:root {
  --sand-deep: #c98745;
  --cream: #fff6e6;
  --ink: #5a3a20;
  --teal: #1f8f86;
  --ember: #c23b2a;
  --gold: #ffd35c;
  --display: "Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--sand-deep); color: var(--cream); font-family: var(--body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  touch-action: none; overscroll-behavior: none;
}
canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  display: flex; flex-direction: column; gap: 6px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-variant-numeric: tabular-nums; text-shadow: 0 1px 5px rgba(50, 25, 10, .6);
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lvl { font-family: var(--display); font-size: 20px; letter-spacing: .06em; }
.side { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.side.r { align-items: flex-end; }
.side span { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; opacity: .9; }
.side strong { font-size: 24px; font-weight: 800; line-height: 1.05; }
.side.l strong { color: #c9fff6; }
.side.r strong { color: #ffd2c8; }
.bar { height: 10px; border-radius: 99px; background: var(--ember); overflow: hidden; box-shadow: 0 1px 4px rgba(50,25,10,.35); }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #17766f, #39c3b4); transition: width .15s linear; }
.iconbtn {
  pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,246,230,.5);
  background: rgba(59,42,28,.3); color: var(--cream); font: 600 13px var(--body); cursor: pointer;
}
.iconbtn:focus-visible, .cta:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  text-align: center; gap: 14px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(60,32,14,.8), rgba(60,32,14,0) 62%);
}
.logo { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 8vh); z-index: 11; pointer-events: none; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 11vw, 84px); letter-spacing: .18em; padding-left: .18em; line-height: 1;
  color: #fff4dc; text-shadow: 0 2px 0 #a8743f, 0 6px 24px rgba(60,30,10,.6); }
.logo p { margin: 10px 0 0; font-size: 15px; letter-spacing: .5em; padding-left: .5em; text-transform: uppercase; color: #fff4dc; font-weight: 700; text-shadow: 0 1px 6px rgba(60,30,10,.7); }
.how { max-width: 34ch; font-size: 16px; line-height: 1.5; text-shadow: 0 1px 6px rgba(50,25,10,.7); }
.how b { color: var(--gold); font-weight: 700; }
.cta { font: 800 18px var(--body); letter-spacing: .12em; text-transform: uppercase; color: #fff; background: var(--teal); border: 0; border-radius: 999px;
  padding: 16px 44px; cursor: pointer; box-shadow: 0 6px 24px rgba(31,143,134,.5), inset 0 1px 0 rgba(255,255,255,.25); }
.sub { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; opacity: .9; font-variant-numeric: tabular-nums; }
.result h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 9vw, 52px); letter-spacing: .06em; color: var(--gold); text-shadow: 0 2px 0 #8a5a22; }
.result p { margin: 0; font-size: 17px; }
.result strong { font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; }
.cta.ghost { background: rgba(20,10,40,.6); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); font-size: 14px; padding: 12px 32px; }
</style>

<canvas id="c" aria-label="Sandblade Siege game"></canvas>

<div class="hud" id="hud" hidden>
  <div class="row">
    <div class="side l"><span>Your army</span><strong id="blueN">0</strong></div>
    <span class="lvl" id="lvl">Level 1</span>
    <div class="side r"><span>Horde</span><strong id="redN">0</strong></div>
  </div>
  <div class="row"><div class="bar" style="flex:1"><i id="bar"></i></div><button class="iconbtn" id="pauseBtn" aria-label="Pause">II</button><button class="iconbtn" id="mute" aria-label="Toggle sound">♪</button></div>
</div>

<div class="logo" id="logo"><h1>Sandblade</h1><p>Siege</p></div>

<div class="overlay" id="menu">
  <div class="how"><b>Drag</b> to aim the cannon. Every rider who runs through a gate gets multiplied. Send them through the <b>×999</b> and flood the horde.</div>
  <button class="cta" id="play">Fire</button>
  <div class="sub" id="menuLvl"></div>
</div>

<div class="overlay result" id="pauseMenu" hidden>
  <h2>Paused</h2>
  <button class="cta" id="resume">Resume</button>
  <button class="cta ghost" id="restart">Restart</button>
</div>

<div class="overlay result" id="win" hidden>
  <h2 id="winTitle">Total domination</h2>
  <p><strong id="winCount">0</strong> riders standing</p>
  <div class="sub" id="winSub"></div>
  <button class="cta" id="next">Next level</button>
</div>

<script>
(() => {
"use strict";
const cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
const $ = id => document.getElementById(id);
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR); }
addEventListener("resize", resize); resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const TAU = Math.PI * 2;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function fmt(n) {
  n = Math.max(0, Math.round(n));
  if (n < 100000) return n.toLocaleString();
  if (n < 1e6) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  if (n < 1e9) return (n / 1e6).toFixed(2).replace(/0$/, "").replace(/\.0$/, "") + "M";
  return (n / 1e9).toFixed(2).replace(/0$/, "").replace(/\.0$/, "") + "B";
}

// ---------- world ----------
const LW = 600, LH = 1350, R = 5, MAX_BLUE = 1500;
let walls = [], gates = [], arenaY = 1004;

function buildLevel(L) {
  const mirror = L > 1 && Math.random() < 0.5;
  const T = 22;
  const vals = L === 1
    ? { center: 20, left: ["+", 50], right: ["×", 2], megaL: 99, megaR: 999 }
    : { center: ri(10, 30), left: ["+", ri(1, 5) * 50 * L], right: ["×", ri(2, 5)], megaL: ri(50, 199), megaR: ri(500, 999) };
  const raw = [
    [0, 0, 20, LH], [580, 0, 20, LH], [0, LH - 20, LW, 20],
    [20, 220, 150, T], [430, 220, 150, T],               // stubs in the courtyard
    [200, 420, 20, 340], [380, 420, 20, 340],            // centre corridor walls
    [20, 520, 120, T], [80, 640, 120, T],                // left zigzag
    [460, 520, 120, T], [400, 640, 120, T],              // right zigzag
    [290, 780, 20, 200],                                 // divider in the junction
    [0, 980, 50, 24], [210, 980, 180, 24], [550, 980, 50, 24] // rampart with two openings
  ];
  walls = raw.map(([x, y, w, h]) => ({ x: mirror ? LW - x - w : x, y, w, h }));
  const g = (x1, x2, y, op, v) => {
    if (mirror) [x1, x2] = [LW - x2, LW - x1];
    return { x1, x2, y, op, v, pulse: 0, hits: 0, announced: false };
  };
  gates = [
    g(220, 380, 560, "×", vals.center),
    g(20, 200, 730, vals.left[0], vals.left[1]),
    g(400, 580, 730, vals.right[0], vals.right[1]),
    g(50, 210, 992, "×", vals.megaL),
    g(390, 550, 992, "×", vals.megaR)
  ];
  gates.forEach((q, i) => q.id = i);
  buildBlocked();
}

// flow field toward the top of the arena
const FC = 20, FW = Math.ceil(LW / FC), FH = Math.ceil(LH / FC);
let flowX, flowY, blocked;
function inWall(x, y, pad) { for (const w of walls) if (x > w.x - pad && x < w.x + w.w + pad && y > w.y - pad && y < w.y + w.h + pad) return true; return false; }
function buildBlocked() {
  blocked = new Uint8Array(FW * FH);
  for (let j = 0; j < FH; j++) for (let i = 0; i < FW; i++) blocked[j * FW + i] = inWall((i + 0.5) * FC, (j + 0.5) * FC, 7) ? 1 : 0;
}
// Flow toward the nearest living enemy (falls back to the top of the arena).
function buildFlow() {
  const dist = new Float32Array(FW * FH).fill(1e9), q = [];
  for (const u of red) {
    const k = clamp((u.y / FC) | 0, 0, FH - 1) * FW + clamp((u.x / FC) | 0, 0, FW - 1);
    if (!blocked[k] && dist[k] !== 0) { dist[k] = 0; q.push(k); }
  }
  if (!q.length) for (let i = 0; i < FW; i++) { const k = (FH - 3) * FW + i; if (!blocked[k]) { dist[k] = 0; q.push(k); } }
  for (let h = 0; h < q.length; h++) {
    const k = q[h], i = k % FW, j = (k / FW) | 0;
    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const ni = i + di, nj = j + dj; if (ni < 0 || nj < 0 || ni >= FW || nj >= FH) continue;
      const nk = nj * FW + ni; if (blocked[nk] || dist[nk] <= dist[k] + 1) continue;
      dist[nk] = dist[k] + 1; q.push(nk);
    }
  }
  flowX = new Float32Array(FW * FH); flowY = new Float32Array(FW * FH);
  for (let j = 0; j < FH; j++) for (let i = 0; i < FW; i++) {
    const k = j * FW + i; let best = dist[k], bx = 0, by = 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue;
      const ni = i + di, nj = j + dj; if (ni < 0 || nj < 0 || ni >= FW || nj >= FH) continue;
      const nk = nj * FW + ni; if (blocked[nk]) continue;
      if (di && dj && (blocked[j * FW + ni] || blocked[nj * FW + i])) continue;
      const c = dist[nk] + (di && dj ? 0.41 : 0);
      if (c < best) { best = c; bx = di; by = dj; }
    }
    const l = Math.hypot(bx, by) || 1; flowX[k] = bx / l; flowY[k] = by / l;
  }
}

// ---------- state ----------
let level = Math.max(1, +(store.get("siege-level") || 1));
let muted = store.get("siege-muted") === "1";
let flowT = 0;
let phase = "menu", blue = [], red = [], parts = [], banners = [], cannon, elapsed, fireT, camY, blueTotal, redTotal, redStart, shownBlue, shownRed, shake, flash, charged, winT;

function reset() {
  buildLevel(level);
  blue = []; red = []; parts = []; banners = [];
  cannon = { x: 300, tx: 300, recoil: 0 };
  elapsed = 0; fireT = 0; camY = 0; shake = 0; flash = 0; charged = false; winT = 0;
  redStart = level === 1 ? 1000000 : Math.round(1e6 * (1 + (level - 1) * 1.6));
  const sp = 12, cols = Math.floor((LW - 60) / sp), rows = Math.floor((LH - 40 - 1080) / sp);
  const n = cols * rows, w = redStart / n;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++)
    red.push({ x: 30 + i * sp + (j % 2) * sp / 2 + rnd(-1.5, 1.5), y: 1080 + j * sp + rnd(-1.5, 1.5), w, ph: Math.random() * TAU });
  buildFlow(); flowT = 0;
  redTotal = redStart; blueTotal = 0; shownBlue = 0; shownRed = redStart;
}

// ---------- audio ----------
let actx = null, master;
function initAudio() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(actx.destination); } catch (e) { actx = null; }
}
function tone(f, dur = 0.3, vol = 0.1, type = "sine", delay = 0, slide = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
let lastPop = 0, lastClash = 0;
const sfx = {
  shot() { tone(180, 0.08, 0.035, "triangle", 0, 0.6); },
  gate(big) { const now = performance.now(); if (now - lastPop < 70) return; lastPop = now; tone(big ? 880 : 620 + Math.random() * 120, 0.12, big ? 0.06 : 0.04, "sine"); },
  mega() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.6, 0.08, "triangle", i * 0.06)); tone(65, 0.8, 0.2, "sine"); },
  clash() { const now = performance.now(); if (now - lastClash < 45) return; lastClash = now; tone(90 + Math.random() * 90, 0.07, 0.05, "square"); },
  horn() { tone(147, 0.9, 0.12, "sawtooth", 0, 1.01); tone(220, 0.9, 0.08, "sawtooth", 0.05, 1.01); },
  win() { [523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.8, 0.08, "triangle", i * 0.08)); }
};
function setMuted(m) { muted = m; store.set("siege-muted", m ? "1" : "0"); $("mute").textContent = m ? "✕" : "♪"; $("mute").setAttribute("aria-pressed", String(m)); if (master) master.gain.value = m ? 0 : 0.6; }
setMuted(muted);

// ---------- view ----------
let sc = 1, ox = 0, viewH = LH, hudH = 90;
function layout() {
  hudH = 92;
  sc = Math.min(W / (LW + 20), (H - hudH - 8) / LH);
  ox = (W - LW * sc) / 2;
  viewH = (H - hudH) / sc;
}
const sx = x => ox + x * sc;
const sy = y => H - (y - camY) * sc;

// ---------- input ----------
let dragging = false;
addEventListener("pointerdown", e => {
  if (e.target.closest && e.target.closest("button")) return;
  if (paused) return;
  initAudio(); dragging = true; aim(e.clientX);
}, { passive: true });
addEventListener("pointermove", e => { if (dragging) aim(e.clientX); }, { passive: true });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointercancel", () => dragging = false);
function aim(px) { if (phase === "play") cannon.tx = clamp((px - ox) / sc, 40, LW - 40); }
addEventListener("keydown", e => {
  if (phase !== "play") return;
  if (e.code === "ArrowLeft" || e.code === "KeyA") cannon.tx = clamp(cannon.tx - 60, 40, LW - 40);
  if (e.code === "ArrowRight" || e.code === "KeyD") cannon.tx = clamp(cannon.tx + 60, 40, LW - 40);
});
addEventListener("contextmenu", e => e.preventDefault());
$("mute").addEventListener("click", () => { initAudio(); setMuted(!muted); });
$("play").addEventListener("click", start);
$("next").addEventListener("click", () => { level++; store.set("siege-level", String(level)); start(); });
function updateMenu() { $("menuLvl").textContent = `Level ${level}`; }
updateMenu();

function start() {
  initAudio(); reset(); phase = "play"; paused = false; $("pauseMenu").hidden = true;
  ["menu", "win", "logo"].forEach(id => $(id).hidden = true);
  $("hud").hidden = false; $("lvl").textContent = `Level ${level}`;
  banner(`HORDE OF ${fmt(redStart)}`, "#ffd2c8", 1.2); sfx.horn();
}
function win() {
  phase = "won"; winT = 0;
  $("winTitle").textContent = ["Total domination", "Flawless victory", "Crushed them", "Unstoppable"][(level - 1) % 4];
  $("winCount").textContent = fmt(blueTotal);
  $("winSub").textContent = `Level ${level} · ${fmt(redStart)} wiped out in ${elapsed.toFixed(1)}s`;
  sfx.win(); flash = 0.6;
  setTimeout(() => { if (phase === "won") { $("hud").hidden = true; $("win").hidden = false; } }, 1400);
}

function banner(text, color, size) { banners.push({ text, color, size: size || 1, t: 0 }); if (banners.length > 3) banners.shift(); }

// ---------- simulation ----------
const HC = 12, HW = Math.ceil(LW / HC), HH = Math.ceil(LH / HC);
const head = new Int32Array(HW * HH);
let next = new Int32Array(4096), all = [];

function buildHash() {
  head.fill(-1);
  all = blue.length + red.length > 0 ? blue.concat(red) : [];
  if (next.length < all.length) next = new Int32Array(all.length * 2);
  for (let i = 0; i < all.length; i++) {
    const u = all[i], c = clamp((u.y / HC) | 0, 0, HH - 1) * HW + clamp((u.x / HC) | 0, 0, HW - 1);
    next[i] = head[c]; head[c] = i;
  }
}

function nearestRed(u) {
  let best = null, bd = 1e18;
  for (let i = 0; i < red.length; i += 3) { const o = red[i]; if (o.w <= 0) continue; const d = (o.x - u.x) ** 2 + (o.y - u.y) ** 2; if (d < bd) { bd = d; best = o; } }
  return best;
}
function spawnFromCannon() {
  if (blue.length >= MAX_BLUE) return;
  blue.push({ x: cannon.x + rnd(-6, 6), y: 78, vx: rnd(-30, 30), vy: 260, w: 1, passed: 0, blue: true });
  cannon.recoil = 1; sfx.shot();
}

function applyGate(u, g) {
  u.passed |= 1 << g.id;
  g.pulse = 0.18; g.hits++;
  const total = g.op === "×" ? u.w * g.v : u.w + g.v;
  const budget = MAX_BLUE - blue.length;
  const clones = Math.max(0, Math.min(g.op === "×" ? g.v - 1 : Math.min(g.v, 10), budget, g.v >= 99 ? 9 : 6));
  const each = total / (clones + 1);
  u.w = each;
  for (let k = 0; k < clones; k++)
    blue.push({ x: clamp(u.x + rnd(-14, 14), g.x1 + 6, g.x2 - 6), y: g.y + rnd(2, 16), vx: rnd(-60, 60), vy: rnd(120, 220), w: each, passed: u.passed, blue: true });
  const big = g.op === "×" && g.v >= 50;
  sfx.gate(big);
  if (parts.length < 260) for (let k = 0; k < (big ? 4 : 2); k++) parts.push({ x: u.x, y: g.y, vx: rnd(-80, 80), vy: rnd(20, 140), life: 0.5, max: 0.5, c: big ? "255,215,110" : "180,245,255", s: big ? 3 : 2 });
  if (!g.announced && big) { g.announced = true; banner(`×${g.v}!`, "#ffe08a", 2.2); sfx.mega(); flash = 0.35; shake = 0.35; }
}

function step(dt) {
  elapsed += dt;
  // cannon
  cannon.x = lerp(cannon.x, cannon.tx, 1 - Math.exp(-14 * dt));
  cannon.recoil = Math.max(0, cannon.recoil - dt * 8);
  if (phase === "play") {
    const rate = Math.min(14 + elapsed * 2.2, 42);
    fireT -= dt;
    while (fireT <= 0) { fireT += 1 / rate; spawnFromCannon(); }
  }

  flowT -= dt; if (flowT <= 0) { flowT = 0.3; buildFlow(); }
  buildHash();
  const SPEED = 150, rr = R * 2, rr2 = rr * rr, FIGHT = 11, FIGHT2 = FIGHT * FIGHT;
  for (const u of blue) {
    if (u.w <= 0) continue;
    const fi = clamp((u.x / FC) | 0, 0, FW - 1), fj = clamp((u.y / FC) | 0, 0, FH - 1), fk = fj * FW + fi;
    let dx = flowX[fk], dy = flowY[fk];
    if (blocked[fk]) { dx = 0; dy = 1; }
    else if ((dx === 0 && dy === 0) || u.y > arenaY) {
      if (!u.tgt || u.tgt.w <= 0 || Math.random() < 0.02) u.tgt = nearestRed(u);
      if (u.tgt) { const ex = u.tgt.x - u.x, ey = u.tgt.y - u.y, l = Math.hypot(ex, ey) || 1; dx = ex / l; dy = ey / l; }
    }
    const k = 1 - Math.exp(-5 * dt);
    u.vx += (dx * SPEED + rnd(-25, 25) - u.vx) * k;
    u.vy += (dy * SPEED - u.vy) * k;
    // neighbours: separation and combat
    const ci = (u.x / HC) | 0, cj = (u.y / HC) | 0;
    for (let j = cj - 1; j <= cj + 1; j++) {
      if (j < 0 || j >= HH) continue;
      for (let i = ci - 1; i <= ci + 1; i++) {
        if (i < 0 || i >= HW) continue;
        for (let n = head[j * HW + i]; n !== -1; n = next[n]) {
          const o = all[n]; if (o === u || o.w <= 0) continue;
          const ex = u.x - o.x, ey = u.y - o.y, d2 = ex * ex + ey * ey;
          if (!o.blue && d2 < FIGHT2 && u.w > 0) {
            const m = Math.min(u.w, o.w); u.w -= m; o.w -= m;
            if (!charged) { charged = true; banner("CHARGE!", "#c9fff6", 1.4); shake = 0.3; }
            sfx.clash();
            if (parts.length < 260 && Math.random() < 0.5) parts.push({ x: o.x, y: o.y, vx: rnd(-60, 60), vy: rnd(-60, 60), life: 0.35, max: 0.35, c: o.w <= 0 ? "200,60,40" : "120,230,215", s: 2.5 });
          }
          if (d2 < rr2 && d2 > 0.0001) {
            const d = Math.sqrt(d2), push = (rr - d) / d * (o.blue ? 0.5 : 1);
            u.x += ex * push; u.y += ey * push;
          }
        }
      }
    }
    const py = u.y;
    u.x += u.vx * dt; u.y += u.vy * dt;
    // walls
    for (const w of walls) {
      if (u.x > w.x - R && u.x < w.x + w.w + R && u.y > w.y - R && u.y < w.y + w.h + R) {
        const l = u.x - (w.x - R), r = w.x + w.w + R - u.x, b = u.y - (w.y - R), t = w.y + w.h + R - u.y, m = Math.min(l, r, b, t);
        if (m === l) { u.x -= l; u.vx = Math.min(u.vx, 0); } else if (m === r) { u.x += r; u.vx = Math.max(u.vx, 0); }
        else if (m === b) { u.y -= b; u.vy = Math.min(u.vy, 0); } else { u.y += t; u.vy = Math.max(u.vy, 0); }
      }
    }
    u.x = clamp(u.x, 20 + R, LW - 20 - R); u.y = clamp(u.y, 10, LH - 20 - R);
    // gates
    for (const g of gates) if (!(u.passed & (1 << g.id)) && py < g.y && u.y >= g.y && u.x >= g.x1 && u.x <= g.x2) applyGate(u, g);
  }
  blue = blue.filter(u => u.w > 1e-6);
  red = red.filter(u => u.w > 1e-6);
  blueTotal = 0; for (const u of blue) blueTotal += u.w;
  redTotal = 0; for (const u of red) redTotal += u.w;
  if (phase === "play" && (redTotal < 0.5 || red.length === 0)) { redTotal = 0; win(); }

  for (const q of parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  parts = parts.filter(q => q.life > 0);
  for (const g of gates) g.pulse = Math.max(0, g.pulse - dt);
  for (const b of banners) b.t += dt;
  banners = banners.filter(b => b.t < 1.9);
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt);
  shownBlue = Math.abs(blueTotal - shownBlue) < 1 ? blueTotal : lerp(shownBlue, blueTotal, 1 - Math.exp(-8 * dt));
  shownRed = Math.abs(redTotal - shownRed) < 1 ? redTotal : lerp(shownRed, redTotal, 1 - Math.exp(-8 * dt));

  // camera: follow the front of the army, keep the level in frame
  let front = 0; for (const u of blue) if (u.y > front) front = u.y;
  const maxCam = Math.max(0, LH - viewH);
  const target = clamp(front - viewH * 0.55, 0, maxCam);
  camY = lerp(camY, target, 1 - Math.exp(-2 * dt));
}

// ---------- sprites ----------
function makeSprite(body, dark, head, blade) {
  const s = 32, c = document.createElement("canvas"); c.width = c.height = s; const g = c.getContext("2d");
  g.fillStyle = "rgba(60,30,10,.28)"; g.beginPath(); g.ellipse(17, 20, 11, 7, 0, 0, TAU); g.fill();
  g.fillStyle = dark; g.beginPath(); g.arc(16, 17, 10, 0, TAU); g.fill();
  g.fillStyle = body; g.beginPath(); g.arc(16, 16, 9, 0, TAU); g.fill();
  g.fillStyle = head; g.beginPath(); g.arc(16, 12.5, 5, 0, TAU); g.fill();
  g.strokeStyle = blade; g.lineWidth = 2.5; g.lineCap = "round"; g.beginPath(); g.moveTo(23, 16); g.lineTo(26, 5); g.stroke();
  return c;
}
const SPR_BLUE = makeSprite("#2fa79b", "#17665f", "#eef6f2", "#f2c75a");
const SPR_RED = makeSprite("#d2452f", "#8e2618", "#3a2016", "#9aa0a8");

// ---------- drawing ----------
function rect(x, y, w, h) { ctx.fillRect(sx(x), sy(y + h), w * sc, h * sc); }

function drawFloor(t) {
  // dunes around the fortress
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#e9b877"); g.addColorStop(1, "#d39552");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,236,200,.25)"; ctx.lineWidth = 2;
  for (let k = 0; k < 18; k++) {
    const y = ((k * 120 - camY * sc * 0.5) % (H + 120) + H + 120) % (H + 120) - 60;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.quadraticCurveTo(W * 0.3, y - 14, W * 0.6, y + 4); ctx.quadraticCurveTo(W * 0.85, y + 14, W, y - 2); ctx.stroke();
  }
  // paved floor of the fortress
  ctx.fillStyle = "#ecd6b3"; rect(20, 0, LW - 40, arenaY);
  // arena sand
  ctx.fillStyle = "#e7c391"; rect(20, arenaY, LW - 40, LH - arenaY - 20);
  // slab seams
  ctx.strokeStyle = "rgba(150,105,65,.16)"; ctx.lineWidth = 1;
  for (let y = 0; y < arenaY; y += 40) { ctx.beginPath(); ctx.moveTo(sx(20), sy(y)); ctx.lineTo(sx(LW - 20), sy(y)); ctx.stroke(); }
  for (let x = 60; x < LW - 20; x += 40) { ctx.beginPath(); ctx.moveTo(sx(x), sy(0)); ctx.lineTo(sx(x), sy(arenaY)); ctx.stroke(); }
}

function drawWalls() {
  const lift = 9;
  for (const w of walls) {
    const x = sx(w.x), y = sy(w.y + w.h), ww = w.w * sc, hh = w.h * sc, l = lift * sc;
    ctx.fillStyle = "rgba(70,40,15,.22)"; ctx.fillRect(x + 3 * sc, y + 4 * sc, ww, hh);
    ctx.fillStyle = "#a9774a"; ctx.fillRect(x, y + hh - l, ww, l);           // front face
    ctx.fillStyle = "#e9c99c"; ctx.fillRect(x, y - l, ww, hh);               // top
    ctx.strokeStyle = "rgba(120,80,45,.35)"; ctx.lineWidth = 1;
    if (w.w > w.h) for (let k = 30; k < w.w; k += 30) { ctx.beginPath(); ctx.moveTo(sx(w.x + k), y - l); ctx.lineTo(sx(w.x + k), y - l + hh); ctx.stroke(); }
    else for (let k = 30; k < w.h; k += 30) { ctx.beginPath(); ctx.moveTo(x, sy(w.y + k) - l); ctx.lineTo(x + ww, sy(w.y + k) - l); ctx.stroke(); }
  }
}

function drawGates() {
  for (const g of gates) {
    const mega = g.op === "×" && g.v >= 50, good = g.op === "×" || g.v > 0;
    const x = sx(g.x1), w = (g.x2 - g.x1) * sc, y = sy(g.y), h = Math.max(14, 30 * sc) * (1 + g.pulse * 0.6);
    if (mega) { ctx.save(); ctx.shadowColor = "rgba(255,210,90,.95)"; ctx.shadowBlur = 18 + g.pulse * 40; }
    ctx.fillStyle = mega ? "#ffd35c" : good ? "#59c4ea" : "#e0553f";
    ctx.fillRect(x, y - h / 2, w, h);
    if (mega) ctx.restore();
    // hazard stripes on mega gates
    if (mega) {
      ctx.save(); ctx.beginPath(); ctx.rect(x, y - h / 2, w, h); ctx.clip();
      ctx.fillStyle = "rgba(40,30,20,.85)";
      for (let k = -h; k < w; k += 22 * sc + 6) { ctx.beginPath(); ctx.moveTo(x + k, y + h / 2); ctx.lineTo(x + k + 6 * sc, y + h / 2); ctx.lineTo(x + k + 6 * sc + h, y - h / 2); ctx.lineTo(x + k + h, y - h / 2); ctx.fill(); }
      ctx.fillStyle = "#ffd35c"; const tw = Math.min(w * 0.7, 90 * sc + 20); ctx.fillRect(x + w / 2 - tw / 2, y - h / 2 + 2, tw, h - 4);
      ctx.restore();
    }
    ctx.strokeStyle = "rgba(60,35,15,.7)"; ctx.lineWidth = 2; ctx.strokeRect(x, y - h / 2, w, h);
    ctx.fillStyle = "#7a5030"; const pw = Math.max(3, 8 * sc); ctx.fillRect(x - pw, y - h / 2 - 2, pw, h + 4); ctx.fillRect(x + w, y - h / 2 - 2, pw, h + 4);
    const label = (g.op === "×" ? "×" : g.v >= 0 ? "+" : "−") + Math.abs(g.v);
    ctx.font = `800 ${Math.max(12, h * 0.78)}px Jost, system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = mega ? "#2a1a0c" : "#fff"; ctx.fillText(label, x + w / 2, y + 1);
  }
}

function drawUnits(t) {
  const s = Math.max(5, 15 * sc), hs = s / 2, top = camY - 20, bot = camY + viewH + 40;
  for (const u of red) {
    if (u.y < top || u.y > bot) continue;
    const bob = Math.sin(t * 6 + u.ph) * 0.6;
    ctx.drawImage(SPR_RED, sx(u.x) - hs, sy(u.y) - hs + bob, s, s);
  }
  for (const u of blue) {
    if (u.y < top || u.y > bot) continue;
    const big = u.w >= 1000 ? 1.25 : 1;
    ctx.drawImage(SPR_BLUE, sx(u.x) - hs * big, sy(u.y) - hs * big, s * big, s * big);
  }
}

function drawCannon() {
  const x = sx(cannon.x), y = sy(55), r = Math.max(12, 26 * sc), rec = cannon.recoil * 5 * sc;
  ctx.fillStyle = "rgba(60,30,10,.3)"; ctx.beginPath(); ctx.ellipse(x + 3, y + 6, r * 1.2, r * 0.8, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#6a4a2e"; ctx.fillRect(x - r * 0.35, y - r * 1.9 + rec, r * 0.7, r * 1.5);
  ctx.fillStyle = "#e2b54e"; ctx.fillRect(x - r * 0.45, y - r * 1.95 + rec, r * 0.9, r * 0.3);
  ctx.fillStyle = "#1f8f86"; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = "#2fb3a6"; ctx.beginPath(); ctx.arc(x - r * 0.2, y - r * 0.2, r * 0.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#e2b54e"; ctx.lineWidth = Math.max(2, 4 * sc); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  if (phase === "play" && elapsed < 4) {
    ctx.fillStyle = `rgba(255,246,230,${0.6 + 0.4 * Math.sin(elapsed * 6)})`; ctx.font = "700 14px Jost, system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("◀  DRAG TO AIM  ▶", x, y + r + 22);
  }
}

function drawFx() {
  for (const q of parts) { ctx.fillStyle = `rgba(${q.c},${(q.life / q.max).toFixed(3)})`; ctx.beginPath(); ctx.arc(sx(q.x), sy(q.y), q.s * Math.max(1, sc * 1.5), 0, TAU); ctx.fill(); }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  banners.forEach((b, i) => {
    const a = b.t < 0.12 ? b.t / 0.12 : clamp(1 - (b.t - 1.4) / 0.5, 0, 1), pop = 1 + Math.max(0, 0.3 - b.t) * 2;
    const size = Math.min(40 * b.size * pop, W * 0.2), y = H * 0.32 + i * 56;
    ctx.font = `800 ${size}px Jost, system-ui, sans-serif`;
    ctx.globalAlpha = a; ctx.lineJoin = "round"; ctx.lineWidth = Math.max(5, size * 0.12); ctx.strokeStyle = "rgba(70,35,12,.9)"; ctx.strokeText(b.text, W / 2, y);
    ctx.fillStyle = b.color; ctx.fillText(b.text, W / 2, y); ctx.globalAlpha = 1;
  });
  if (flash > 0) { ctx.fillStyle = `rgba(255,240,200,${flash * 0.55})`; ctx.fillRect(0, 0, W, H); }
}

function render(t) {
  layout();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
  drawFloor(t);
  drawGates();
  drawUnits(t);
  drawWalls();
  drawCannon();
  drawFx();
}

function hud() {
  if (phase !== "play" && phase !== "won") return;
  $("blueN").textContent = fmt(shownBlue);
  $("redN").textContent = fmt(shownRed);
  const tot = shownBlue + shownRed;
  $("bar").style.width = (tot > 0 ? clamp(shownBlue / tot, 0, 1) * 100 : 0) + "%";
}

reset(); layout();
let last = performance.now();
// ---------- pause ----------
let paused = false;
function setPaused(on) {
  if (on && !(phase === "play")) return;
  paused = on; document.getElementById("pauseMenu").hidden = !on;
  if (on) { dragging = false; }
}
document.getElementById("pauseBtn").addEventListener("click", () => setPaused(true));
document.getElementById("resume").addEventListener("click", () => setPaused(false));
document.getElementById("restart").addEventListener("click", () => { setPaused(false); start(); });
addEventListener("keydown", e => { if (e.code === "Escape" || e.code === "KeyP") setPaused(!paused); }, true);
document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  layout();
  if ((phase === "play" || phase === "won") && !paused) step(dt);
  render(now / 1000); hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
