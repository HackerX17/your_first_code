<title>Sandblade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c9a27a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: one full-bleed canvas world; HTML overlays float on top for HUD and menus. Single warm desert look in every theme. */
:root {
  --sky: #9fb2d6;
  --sand: #f0c27f;
  --sand-deep: #c98745;
  --ink: #3b2a1c;
  --cream: #fff6e6;
  --teal: #1f7f78;
  --glow: #aee8ff;
  --display: "Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--sand-deep); color: var(--cream);
  font-family: var(--body); -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  touch-action: none; overscroll-behavior: none;
}
canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(60, 35, 15, .45);
}
.hud .stat { display: flex; flex-direction: column; gap: 2px; }
.hud .big { font-family: var(--display); font-size: 30px; line-height: 1; letter-spacing: .02em; }
.hud .small { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.powers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 99px; background: rgba(59,42,28,.45); font-size: 12px; font-weight: 600; letter-spacing: .06em; }
.chip b { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: #2a1a0c; }
.chip u { display: block; width: 34px; height: 4px; border-radius: 4px; background: rgba(255,246,230,.25); overflow: hidden; text-decoration: none; }
.chip u i { display: block; height: 100%; background: var(--cream); }
.hud .right { display: flex; align-items: center; gap: 12px; }
.shards { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.shards i { display: inline-block; width: 12px; height: 12px; transform: rotate(45deg); background: var(--glow); box-shadow: 0 0 10px var(--glow); }
.iconbtn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,246,230,.5);
  background: rgba(59,42,28,.25); color: var(--cream); font: 600 13px var(--body); cursor: pointer;
}
.iconbtn:focus-visible, .cta:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  text-align: center; gap: 14px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(70,40,20,.55), rgba(70,40,20,0) 55%);
}
.logo {
  position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12vh); z-index: 11; pointer-events: none;
  text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.logo h1 {
  margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(44px, 13vw, 96px);
  letter-spacing: .22em; padding-left: .22em; color: #fff4dc;
  text-shadow: 0 2px 0 #c99a62, 0 6px 24px rgba(120, 70, 30, .45);
}
.logo p { margin: 8px 0 0; font-size: 15px; letter-spacing: .3em; text-transform: uppercase; color: #6a4526; }
.how { max-width: 34ch; font-size: 16px; line-height: 1.5; text-shadow: 0 1px 6px rgba(60,35,15,.6); }
.how b { color: var(--glow); font-weight: 600; }
.cta {
  font: 600 18px var(--body); letter-spacing: .12em; text-transform: uppercase; color: #fff;
  background: var(--teal); border: 0; border-radius: 999px; padding: 16px 44px; cursor: pointer;
  box-shadow: 0 6px 24px rgba(31,127,120,.45), inset 0 1px 0 rgba(255,255,255,.25);
}
.best { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; opacity: .9; font-variant-numeric: tabular-nums; }
.over h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 48px); letter-spacing: .08em; }
.statsgrid { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 28px; font-variant-numeric: tabular-nums; }
.statsgrid div { display: flex; flex-direction: column; gap: 2px; }
.statsgrid span { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.statsgrid strong { font-family: var(--display); font-weight: 400; font-size: 28px; }
.newbest { color: var(--glow); letter-spacing: .2em; text-transform: uppercase; font-size: 13px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .cta { transition: none; } }
</style>

<canvas id="c" aria-label="Sandblade game"></canvas>

<div class="hud" id="hud" hidden>
  <div class="stat"><span class="big" id="dist">0 m</span><span class="small" id="scoreLbl">Score 0</span><div class="powers" id="powers"></div></div>
  <div class="right">
    <div class="shards"><i></i><span id="shardCount">0</span></div>
    <button class="iconbtn" id="mute" aria-label="Toggle sound">♪</button>
  </div>
</div>

<div class="logo" id="logo"><h1>Sandblade</h1><p>Outrun the storm</p></div>

<div class="overlay" id="menu">
  <div class="how"><b>Hold</b> anywhere to get heavy and dive down the dunes.<br><b>Let go</b> on the way up to launch and glide.<br>Land smoothly on downslopes to chain a <b>Fever</b>, grab power-ups, and reach each oasis before the storm.</div>
  <button class="cta" id="play">Ride</button>
  <div class="best" id="bestMenu"></div>
</div>

<div class="overlay over" id="over" hidden>
  <h2>The storm took you</h2>
  <div class="newbest" id="newBest" hidden>New best</div>
  <div class="statsgrid">
    <div><span>Distance</span><strong id="oDist">0</strong></div>
    <div><span>Shards</span><strong id="oShards">0</strong></div>
    <div><span>Score</span><strong id="oScore">0</strong></div>
  </div>
  <button class="cta" id="again">Ride again</button>
  <div class="best" id="bestOver"></div>
</div>

<script>
(() => {
"use strict";
const cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
const $ = id => document.getElementById(id);
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
}
addEventListener("resize", resize); resize();

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const wrap = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const lerpAngle = (a, b, t) => a + wrap(b - a) * t;
let seed = Math.random() * 1000;
const hash = n => { const x = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return x - Math.floor(x); };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

// ---------- terrain ----------
let P1 = 0, P2 = 0, P3 = 0;
function groundY(x) {
  const k = clamp(x / 30000, 0, 1);
  const amp = 0.75 + k * 1.05;
  return amp * (150 * Math.sin(x * 0.0035 + P1) + 52 * Math.sin(x * 0.0081 + P2) + 11 * Math.sin(x * 0.019 + P3));
}
const slopeAt = x => (groundY(x + 2) - groundY(x - 2)) / 4;
function bgY(x) { return 90 * Math.sin(x * 0.0021 + P2 * 2) + 40 * Math.sin(x * 0.0057 + P1); }

// ---------- state ----------
const G = 1100;
let state = "menu";
let p, cam, storm, shards, particles, popups, trail, scarf, nextShardX, elapsed, shardCount, trickScore, combo, comboTimer, flashT, shake;
let powers, pickups, nextPowerX, fever, nextOasis, oasisN, maxAlt, skyMsg;
let hold = false, best = +(store.get("sandblade-best") || 0), muted = store.get("sandblade-muted") === "1";

function reset() {
  seed = Math.random() * 1000;
  P1 = Math.random() * TAU; P2 = Math.random() * TAU; P3 = Math.random() * TAU;
  p = { x: 0, y: groundY(0), vx: 380, vy: 0, rot: 0, grounded: true, air: 0, spin: 0 };
  cam = { x: -200, y: groundY(0) - 400, zoom: 1 };
  storm = { x: -1500, v: 230 };
  shards = []; particles = []; popups = []; trail = [];
  scarf = Array.from({ length: 8 }, () => ({ x: p.x, y: p.y - 50 }));
  powers = { gale: 0, sky: 0, magnet: 0, ward: 0 }; pickups = []; nextPowerX = 2200; fever = 0; nextOasis = 8000; oasisN = 0; maxAlt = 0; skyMsg = false;
  nextShardX = 900; elapsed = 0; shardCount = 0; trickScore = 0; combo = 0; comboTimer = 0; flashT = 0; shake = 0;
}
reset();

const score = () => Math.floor(Math.max(0, p.x) / 10) + shardCount * 25 + trickScore;

// ---------- audio ----------
let actx = null, master, windGain, windFilter;
function initAudio() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(actx.destination);
    const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = last * 0.96 + (Math.random() * 2 - 1) * 0.2; d[i] = last; }
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    windFilter = actx.createBiquadFilter(); windFilter.type = "bandpass"; windFilter.frequency.value = 400; windFilter.Q.value = 0.6;
    windGain = actx.createGain(); windGain.gain.value = 0;
    src.connect(windFilter); windFilter.connect(windGain); windGain.connect(master); src.start();
  } catch (e) { actx = null; }
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
function tone(freq, dur = 0.7, vol = 0.12, type = "sine", delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function chime(i) { const f = SCALE[Math.min(i, SCALE.length - 1)]; tone(f, 0.8, 0.1); tone(f * 2, 0.4, 0.03, "triangle"); }
function chord() { [0, 2, 4].forEach((n, i) => tone(SCALE[n + 2], 1.2, 0.07, "sine", i * 0.06)); }
function thud() { tone(90, 0.3, 0.2, "triangle"); }
function setMuted(m) {
  muted = m; store.set("sandblade-muted", m ? "1" : "0");
  $("mute").textContent = m ? "✕" : "♪";
  $("mute").setAttribute("aria-pressed", String(m));
  if (master) master.gain.value = m ? 0 : 0.8;
}
setMuted(muted);

// ---------- input ----------
function down(e) {
  if (e.target.closest && e.target.closest("button")) return;
  hold = true; initAudio();
}
function up() { hold = false; }
addEventListener("pointerdown", down);
addEventListener("pointerup", up);
addEventListener("pointercancel", up);
addEventListener("blur", up);
addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowDown") {
    e.preventDefault();
    if (state !== "play" && !e.repeat) { start(); return; }
    hold = true; initAudio();
  }
});
addEventListener("keyup", e => { if (e.code === "Space" || e.code === "ArrowDown") hold = false; });
addEventListener("contextmenu", e => e.preventDefault());
$("mute").addEventListener("click", () => { initAudio(); setMuted(!muted); });
$("play").addEventListener("click", start);
$("again").addEventListener("click", start);

function showBest() {
  const t = best > 0 ? `Best ${best.toLocaleString()}` : "";
  $("bestMenu").textContent = t; $("bestOver").textContent = t;
}
showBest();

function start() {
  initAudio(); reset(); hold = false; state = "play";
  $("menu").hidden = true; $("over").hidden = true; $("logo").hidden = true; $("hud").hidden = false;
}
function gameOver() {
  state = "over";
  const s = score(), isBest = s > best;
  if (isBest) { best = s; store.set("sandblade-best", String(best)); }
  $("oDist").textContent = Math.floor(Math.max(0, p.x) / 10) + " m";
  $("oShards").textContent = shardCount;
  $("oScore").textContent = s.toLocaleString();
  $("newBest").hidden = !isBest;
  showBest();
  $("hud").hidden = true; $("over").hidden = false;
  try { navigator.vibrate && navigator.vibrate([40, 60, 80]); } catch (e) {}
  thud();
}

function popup(text, big) { popups.push({ text, t: 0, big: !!big }); if (popups.length > 3) popups.shift(); }

// ---------- particles ----------
function burst(x, y, n, spd, color, life = 0.8, size = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = spd * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.3, life, max: life, size: size * (0.5 + Math.random()), color });
  }
}

// ---------- shards ----------
function spawnShards() {
  const viewW = W / (baseScale() * cam.zoom);
  while (nextShardX < cam.x + viewW + 600) {
    const x0 = nextShardX, r = Math.random();
    if (r < 0.55) {
      // arc floating over a crest
      const n = 4 + Math.floor(Math.random() * 4), lift = 120 + Math.random() * 260;
      for (let i = 0; i < n; i++) {
        const x = x0 + i * 70, t = i / (n - 1);
        shards.push({ x, y: groundY(x) - lift - Math.sin(t * Math.PI) * 90, ph: Math.random() * TAU });
      }
      nextShardX = x0 + n * 70 + 500 + Math.random() * 700;
    } else {
      // line hugging the sand
      const n = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) { const x = x0 + i * 80; shards.push({ x, y: groundY(x) - 55, ph: Math.random() * TAU }); }
      nextShardX = x0 + n * 80 + 400 + Math.random() * 600;
    }
  }
}

// ---------- physics ----------
// Hold = heavy (dive). Release = light (launch and glide). Smooth landings on
// downslopes keep momentum and chain into Fever; slamming into a rise costs speed.
const HOLD_G = 3.1, AIR_G = 0.78, MAX_SPEED = 2700, MIN_SPEED = 190;

function land(a) {
  const vAng = Math.atan2(p.vy, p.vx), d = Math.abs(wrap(vAng - a));
  const downhill = Math.sin(a) > 0.12;
  if (d < 0.38 && downhill && p.air > 0.35) {
    combo++;
    const pts = 50 * Math.min(combo, 10) * (fever > 0 ? 2 : 1); trickScore += pts;
    popup(combo >= 3 ? `Smooth ×${combo}  +${pts}` : `Smooth landing  +${pts}`, combo >= 3);
    if (combo === 3 || (combo > 3 && combo % 3 === 0)) startFever();
    chime(Math.min(combo + 2, SCALE.length - 1));
    burst(p.x, p.y, 16, 160, "rgba(246,216,160,", 0.6, 4);
    return { boost: 110 + combo * 12 };
  }
  if (d > 0.7 && p.air > 0.35) { combo = 0; popup("Rough landing"); thud(); shake = 0.2; burst(p.x, p.y, 26, 220, "rgba(226,180,120,", 0.9, 6); }
  else burst(p.x, p.y, 10, 140, "rgba(246,216,160,", 0.6, 4);
  return { boost: 0 };
}

function startFever() {
  fever = 5; flashT = 0.5; shake = 0.25; chord();
  popup("FEVER!  speed × score ×2", true);
}

function step(dt, auto) {
  const h = auto ? autoHold() : hold;
  const a0 = Math.atan(slopeAt(p.x));
  let mult;
  if (h) mult = p.grounded && Math.sin(a0) < -0.15 ? 1.5 : HOLD_G;   // holding on a climb only mildly hurts
  else mult = p.grounded ? 1 : AIR_G;
  if (powers.sky > 0 && !h) mult *= 0.42;                             // Skyward: floaty glide
  p.vy += G * mult * dt;

  // speed powers
  const sp = Math.hypot(p.vx, p.vy) || 1;
  if (powers.gale > 0 && sp < 2300) { p.vx += p.vx / sp * 1500 * dt; p.vy += p.vy / sp * 1500 * dt; }
  if (fever > 0 && sp < 1900) { p.vx += p.vx / sp * 450 * dt; p.vy += p.vy / sp * 450 * dt; }

  const wasGrounded = p.grounded;
  p.x += p.vx * dt; p.y += p.vy * dt;
  const gy = groundY(p.x), a = Math.atan(slopeAt(p.x));
  if (p.y >= gy) {
    let res = { boost: 0 };
    if (!p.grounded && p.air > 0.2) res = land(a);
    p.y = gy;
    const tx = Math.cos(a), ty = Math.sin(a);
    let s = p.vx * tx + p.vy * ty;
    s = s * (1 - 0.025 * dt) + res.boost;
    s = clamp(s, MIN_SPEED, MAX_SPEED);
    p.vx = s * tx; p.vy = s * ty;
    p.grounded = true; p.air = 0;
  } else if (p.grounded && gy - p.y < 4) {
    p.air = 0;
  } else {
    p.grounded = false; p.air += dt;
    // takeoff kick: leaving a crest fast and light sends you higher
    if (wasGrounded && !h && p.vy < 0) p.vy -= Math.min(260, sp * 0.13);
  }
  const target = p.grounded ? a : Math.atan2(p.vy, p.vx) * 0.75;
  p.rot = lerpAngle(p.rot, target, 1 - Math.exp(-(p.grounded ? 18 : 6) * dt));
}

// menu demo rider: dives on downslopes
function autoHold() { return slopeAt(p.x + 40) > 0.05 && (p.grounded || p.vy > 0); }

// ---------- power-ups ----------
const POWER = {
  gale:   { name: "Gale",    color: "#ffb347", glyph: "»", dur: 4 },
  sky:    { name: "Skyward", color: "#c9a6ff", glyph: "↑", dur: 3.5 },
  magnet: { name: "Magnet",  color: "#7fe0ff", glyph: "◎", dur: 8 },
  ward:   { name: "Ward",    color: "#9ef0a6", glyph: "✦", dur: 0 }
};
function spawnPickups(viewW) {
  while (nextPowerX < cam.x + viewW + 600) {
    const keys = Object.keys(POWER), type = keys[Math.floor(Math.random() * keys.length)];
    pickups.push({ x: nextPowerX, y: groundY(nextPowerX) - 130 - Math.random() * 170, type, ph: Math.random() * TAU });
    nextPowerX += 2600 + Math.random() * 2200;
  }
}
function collectPower(type) {
  const P = POWER[type];
  burst(p.x, p.y - 30, 30, 240, "rgba(255,240,200,", 0.8, 5); flashT = 0.4; shake = 0.2; chord();
  if (type === "gale") { powers.gale = P.dur; storm.x -= 500; popup("GALE!  full speed", true); }
  if (type === "sky") {
    powers.sky = P.dur; p.grounded = false; p.air = 0.01;
    p.vy = Math.min(p.vy, -1650); p.vx = Math.max(p.vx, 950);
    popup("SKYWARD!  to the moon", true);
  }
  if (type === "magnet") { powers.magnet = P.dur; popup("MAGNET!  shards come to you", true); }
  if (type === "ward") { powers.ward = 1; popup("WARD!  the storm can't take you once", true); }
}
function renderPowers() {
  const el = $("powers"); let html = "";
  for (const k of ["gale", "sky", "magnet", "ward"]) {
    const v = powers[k]; if (v <= 0) continue;
    const P = POWER[k], pct = k === "ward" ? 100 : Math.round(v / P.dur * 100);
    html += `<span class="chip"><b style="background:${P.color}">${P.glyph}</b>${P.name}<u><i style="width:${pct}%"></i></u></span>`;
  }
  if (fever > 0) html += `<span class="chip"><b style="background:#ffd35c">★</b>Fever<u><i style="width:${Math.round(fever / 5 * 100)}%"></i></u></span>`;
  if (el._last !== html) { el.innerHTML = html; el._last = html; }
}

function update(dt) {
  const playing = state === "play";
  if (state !== "over") {
    const sub = 3;
    for (let i = 0; i < sub; i++) step(dt / sub, !playing);
  }
  if (playing) {
    elapsed += dt;
    storm.v = Math.min(260 + elapsed * 6, 900);
    storm.x += storm.v * dt;
    if (p.x - storm.x > 2400) storm.x = p.x - 2400;
    if (p.x - storm.x < 0) {
      if (powers.ward > 0) { powers.ward = 0; storm.x = p.x - 1600; popup("Ward broke · storm thrown back", true); flashT = 0.6; shake = 0.4; chord(); }
      else gameOver();
    }
    // oasis checkpoints: reach one and the storm falls back
    if (p.x >= nextOasis) {
      oasisN++; nextOasis += 8000 + oasisN * 1500;
      storm.x = Math.min(storm.x, p.x - 1700) - 300; trickScore += 500;
      popup(`Oasis ${oasisN} reached · storm pushed back  +500`, true); flashT = 0.5; chord();
    }
    for (const k of ["gale", "sky", "magnet"]) powers[k] = Math.max(0, powers[k] - dt);
    fever = Math.max(0, fever - dt);
    const alt = groundY(p.x) - p.y;
    if (!p.grounded && alt > 1400 && !skyMsg) { skyMsg = true; popup(`Sky high!  ${Math.round(alt / 10)} m up`, true); trickScore += 300; }
    if (p.grounded) skyMsg = false;
    maxAlt = Math.max(maxAlt, alt);
    renderPowers();
  }
  const speed = Math.hypot(p.vx, p.vy);

  // trail of the blade tip
  trail.push({ x: p.x - Math.cos(p.rot) * 40, y: p.y - Math.sin(p.rot) * 40 });
  if (trail.length > 30) trail.shift();

  // scarf
  const nx = p.x + Math.sin(p.rot) * 46, ny = p.y - Math.cos(p.rot) * 46;
  scarf[0].x = nx; scarf[0].y = ny;
  for (let i = 1; i < scarf.length; i++) {
    const s = scarf[i], q = scarf[i - 1];
    s.y += 40 * dt + Math.sin(performance.now() / 70 + i) * 0.8;
    let dx = s.x - q.x, dy = s.y - q.y, d = Math.hypot(dx, dy) || 1;
    s.x = q.x + dx / d * 9; s.y = q.y + dy / d * 9;
  }

  // sand spray
  if (p.grounded && state !== "over") {
    const n = speed > 900 ? 3 : speed > 500 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const bx = p.x - Math.cos(p.rot) * 34, by = p.y - Math.sin(p.rot) * 34;
      particles.push({ x: bx, y: by, vx: -p.vx * 0.15 + (Math.random() - 0.5) * 80, vy: -80 - Math.random() * 120 * (speed / 800), life: 0.7, max: 0.7, size: 3 + Math.random() * 4, color: "rgba(250,224,176," });
    }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt; if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.vy += 500 * dt; q.vx *= 1 - 1.5 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
  }

  // shards
  spawnShards();
  comboTimer -= dt;
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    if (s.x < cam.x - 300) { shards.splice(i, 1); continue; }
    if (powers.magnet > 0) { const dx = p.x - s.x, dy = p.y - 30 - s.y, d = Math.hypot(dx, dy); if (d < 520) { const k = Math.min(1, dt * 7); s.x += dx * k; s.y += dy * k; } }
    if (state !== "over" && Math.hypot(s.x - p.x, s.y - (p.y - 30)) < 52) {
      shards.splice(i, 1);
      if (playing) {
        shardCount += fever > 0 ? 2 : 1;
        const sp = Math.hypot(p.vx, p.vy), k = Math.min(1, 1750 / (sp + 40));
        p.vx += 40 * Math.cos(p.rot) * k; p.vy += 40 * Math.sin(p.rot) * k;
        chime(comboTimer > 0 ? (shardCount % SCALE.length) : 0);
        comboTimer = 1.2;
      }
      burst(s.x, s.y, 10, 140, "rgba(190,240,255,", 0.6, 4);
    }
  }
  spawnPickups(W / (baseScale() * cam.zoom));
  for (let i = pickups.length - 1; i >= 0; i--) {
    const q = pickups[i];
    if (q.x < cam.x - 300) { pickups.splice(i, 1); continue; }
    if (playing && Math.hypot(q.x - p.x, q.y - (p.y - 30)) < 70) { pickups.splice(i, 1); collectPower(q.type); }
  }
  for (const pp of popups) pp.t += dt;
  while (popups.length && popups[0].t > 1.6) popups.shift();
  flashT = Math.max(0, flashT - dt); shake = Math.max(0, shake - dt);

  // camera
  const sc = baseScale();
  const above = groundY(p.x) - p.y;
  const tz = clamp(1 - Math.max(0, above - 160) / 1700, 0.3, 1);
  cam.zoom = lerp(cam.zoom, tz, 1 - Math.exp(-3 * dt));
  const s2 = sc * cam.zoom, viewW = W / s2, viewH = H / s2;
  cam.x = p.x - viewW * 0.3;
  const gy = groundY(p.x);
  const desiredTop = Math.min(p.y - viewH * 0.28, gy - viewH * 0.66);
  cam.y = lerp(cam.y, desiredTop, 1 - Math.exp(-6 * dt));

  // audio
  if (actx && windGain) {
    const t = actx.currentTime;
    windFilter.frequency.setTargetAtTime(250 + speed * 0.9 + (p.grounded ? 0 : 300), t, 0.1);
    const v = state === "play" ? 0.05 + (speed / 2700) * 0.25 : 0.04;
    windGain.gain.setTargetAtTime(muted ? 0 : v, t, 0.2);
  }

  // HUD
  if (playing) {
    $("dist").textContent = Math.floor(Math.max(0, p.x) / 10) + " m";
    $("scoreLbl").textContent = "Score " + score().toLocaleString();
    $("shardCount").textContent = shardCount;
  }
}

function baseScale() { return Math.min(W / 600, H / 640); }

// ---------- rendering ----------
const streaks = Array.from({ length: 22 }, () => ({ x: Math.random(), y: Math.random(), l: 0.4 + Math.random(), s: 0.6 + Math.random() }));
const clouds = Array.from({ length: 7 }, (_, i) => ({ x: i * 380 + Math.random() * 200, y: 0.12 + Math.random() * 0.22, r: 60 + Math.random() * 60 }));

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#7f93c4"); g.addColorStop(0.35, "#b9c4dc"); g.addColorStop(0.62, "#f4e2c6"); g.addColorStop(1, "#f2cf9c");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sun glow
  const sx = W * 0.78, sy = H * 0.2;
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * 0.5);
  sg.addColorStop(0, "rgba(255,248,225,.9)"); sg.addColorStop(0.15, "rgba(255,240,210,.35)"); sg.addColorStop(1, "rgba(255,240,210,0)");
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  // clouds
  const u = baseScale();
  const span = 380 * clouds.length;
  for (const c of clouds) {
    let x = ((c.x - cam.x * 0.03 - t * 8) % span + span) % span - 200;
    x *= u * 1.2;
    const y = H * c.y, r = c.r * u * 1.3;
    ctx.fillStyle = "rgba(255,255,255,.88)";
    ctx.beginPath();
    for (let k = 0; k < 5; k++) { const cx = x + (k - 2) * r * 0.7, rr = r * (0.6 + 0.3 * Math.sin(k * 2.3 + c.r)); ctx.moveTo(cx + rr, y + Math.sin(k * 1.7) * r * 0.25); ctx.arc(x + (k - 2) * r * 0.7, y + Math.sin(k * 1.7) * r * 0.25, r * (0.6 + 0.3 * Math.sin(k * 2.3 + c.r)), 0, TAU); }
    ctx.fill();
  }
  // the moon: the storm creeps across it as it closes in
  const mr = Math.min(W, H) * 0.12, mx = W * 0.74, my = H * 0.15;
  const mg = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 2.4);
  mg.addColorStop(0, "rgba(255,252,240,.55)"); mg.addColorStop(1, "rgba(255,252,240,0)");
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, mr * 2.4, 0, TAU); ctx.fill();
  ctx.fillStyle = "#fbf6ea"; ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(200,190,170,.35)";
  for (const [cx, cy, cr] of [[-0.3, -0.2, 0.18], [0.25, 0.1, 0.24], [-0.1, 0.4, 0.12], [0.35, -0.35, 0.1]]) { ctx.beginPath(); ctx.arc(mx + cx * mr, my + cy * mr, cr * mr, 0, TAU); ctx.fill(); }
  if (state === "play") {
    const eclipse = clamp(1 - (p.x - storm.x - 300) / 1800, 0, 1);
    if (eclipse > 0) { ctx.fillStyle = `rgba(90,55,35,${0.85 * eclipse})`; ctx.beginPath(); ctx.arc(mx - mr * 2 + eclipse * mr * 2, my, mr * 1.02, 0, TAU); ctx.fill(); }
  }
  // wind streaks
  ctx.strokeStyle = "rgba(235,242,255,.55)"; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (const s of streaks) {
    const y = ((s.y + t * 0.25 * s.s) % 1) * H * 0.7, x = ((s.x - t * 0.12 * s.s) % 1 + 1) % 1 * W;
    const len = 50 * s.l * u + 20;
    ctx.moveTo(x, y); ctx.lineTo(x - len * 0.35, y + len);
  }
  ctx.stroke();
}

function layerBase(f) { return lerp(H * 0.56, (-cam.y) * baseScale() * cam.zoom, f); }

function drawMesas(f, color, segW, idOff) {
  const u = baseScale() * (0.7 + cam.zoom * 0.3);
  const scroll = cam.x * baseScale() * cam.zoom * f;
  const sw = segW * u, base = layerBase(f);
  const i0 = Math.floor(scroll / sw) - 1, i1 = i0 + Math.ceil(W / sw) + 2;
  ctx.fillStyle = color;
  for (let i = i0; i <= i1; i++) {
    const r = hash(i + idOff), r2 = hash(i * 3.1 + idOff), x = i * sw - scroll;
    const kind = r < 0.45 ? "mesa" : r < 0.75 ? "aqueduct" : "tower";
    if (kind === "mesa") {
      const w = sw * (0.7 + r2 * 0.5), h = (120 + r2 * 140) * u;
      ctx.beginPath();
      ctx.moveTo(x, base + 40 * u);
      ctx.lineTo(x + w * 0.08, base - h * 0.9); ctx.lineTo(x + w * 0.15, base - h);
      for (let k = 1; k < 6; k++) ctx.lineTo(x + w * (0.15 + k * 0.13), base - h + (hash(i * 7 + k) - 0.5) * 12 * u);
      ctx.lineTo(x + w * 0.92, base - h * 0.85); ctx.lineTo(x + w, base + 40 * u);
      ctx.fill();
      // carved arches in the cliff face
      ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = "#7a4c2a";
      const n = 2 + Math.floor(r2 * 3);
      for (let k = 0; k < n; k++) {
        const ax = x + w * (0.25 + k * 0.18), aw = 14 * u, ah = h * 0.35;
        ctx.beginPath(); ctx.moveTo(ax, base); ctx.lineTo(ax, base - ah); ctx.arc(ax + aw / 2, base - ah, aw / 2, Math.PI, 0); ctx.lineTo(ax + aw, base); ctx.fill();
      }
      ctx.restore(); ctx.fillStyle = color;
    } else if (kind === "aqueduct") {
      const w = sw * 0.9, h = (150 + r2 * 90) * u, bh = 26 * u, n = 4 + Math.floor(r2 * 3), gap = w / n;
      ctx.beginPath();
      ctx.rect(x, base - h, w, bh + gap * 0.42);
      for (let k = 0; k < n; k++) { const cx = x + gap * (k + 0.5); ctx.moveTo(cx + gap * 0.32, base - h + bh + gap * 0.42); ctx.arc(cx, base - h + bh + gap * 0.42, gap * 0.32, 0, Math.PI, true); }
      ctx.fill("evenodd");
      for (let k = 0; k <= n; k++) ctx.fillRect(x + gap * k - gap * 0.18 + (k === 0 ? gap * 0.18 : 0) - (k === n ? gap * 0.18 : 0), base - h + bh + gap * 0.42 - 2, gap * 0.36, h);
      // broken end
      ctx.beginPath(); ctx.moveTo(x + w, base - h); ctx.lineTo(x + w + 18 * u, base - h + 10 * u); ctx.lineTo(x + w, base - h + bh); ctx.fill();
    } else {
      const w = 46 * u, h = (180 + r2 * 120) * u, cx = x + sw * 0.4;
      ctx.fillRect(cx, base - h, w, h + 40 * u);
      ctx.fillRect(cx - 8 * u, base - h - 14 * u, w + 16 * u, 16 * u);
      ctx.fillRect(cx - 4 * u, base - h * 0.55, w + 8 * u, 10 * u);
      ctx.save(); ctx.globalAlpha = 0.2; ctx.fillStyle = "#7a4c2a";
      ctx.beginPath(); const ax = cx + w * 0.3, ay = base - h * 0.85, aw = w * 0.4;
      ctx.moveTo(ax, ay + 30 * u); ctx.lineTo(ax, ay); ctx.arc(ax + aw / 2, ay, aw / 2, Math.PI, 0); ctx.lineTo(ax + aw, ay + 30 * u); ctx.fill();
      ctx.restore(); ctx.fillStyle = color;
    }
  }
  ctx.fillRect(0, base + 30 * u, W, H);
}

function haze(alpha, from) {
  const g = ctx.createLinearGradient(0, from, 0, H);
  g.addColorStop(0, `rgba(248,228,198,0)`); g.addColorStop(0.25, `rgba(248,228,198,${alpha})`); g.addColorStop(1, `rgba(248,228,198,${alpha * 0.4})`);
  ctx.fillStyle = g; ctx.fillRect(0, from, W, H - from);
}

function drawBgDunes() {
  const sc = baseScale() * cam.zoom, f = 0.5, base = layerBase(f);
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let sx = 0; sx <= W + 8; sx += 8) {
    const wx = cam.x * f + sx / sc;
    ctx.lineTo(sx, base + (bgY(wx) - 60) * sc * 0.8);
  }
  ctx.lineTo(W, H); ctx.closePath();
  const g = ctx.createLinearGradient(0, base - 150 * sc, 0, H);
  g.addColorStop(0, "#f2d3a4"); g.addColorStop(1, "#e7b47a");
  ctx.fillStyle = g; ctx.fill();
}

const toS = (wx, wy, sc) => [(wx - cam.x) * sc, (wy - cam.y) * sc];

function drawRuins(sc) {
  const seg = 1700, viewW = W / sc;
  const i0 = Math.floor((cam.x - 400) / seg), i1 = Math.floor((cam.x + viewW + 400) / seg);
  for (let i = i0; i <= i1; i++) {
    if (i < 1 || hash(i * 5.3) < 0.45) continue;
    const r = hash(i * 9.7), x = i * seg + r * 1100;
    const gy = groundY(x), h = 170 + r * 240, w = 54 + r * 20, tilt = (hash(i * 2.2) - 0.5) * 0.35;
    const [sx, sy] = toS(x, gy + 60, sc);
    ctx.save(); ctx.translate(sx, sy); ctx.scale(sc, sc); ctx.rotate(tilt);
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, "#f3d2a6"); g.addColorStop(0.6, "#e5b986"); g.addColorStop(1, "#c99363");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, -h);
    for (let k = 1; k <= 4; k++) ctx.lineTo(-w / 2 + (w * k) / 4, -h + (hash(i * 13 + k) - 0.3) * 40);
    ctx.lineTo(w / 2, 0); ctx.fill();
    ctx.strokeStyle = "rgba(140,90,50,.25)"; ctx.lineWidth = 3;
    for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(k * w * 0.25, -10); ctx.lineTo(k * w * 0.25, -h + 30); ctx.stroke(); }
    ctx.fillStyle = "#c9935f"; ctx.fillRect(-w / 2 - 6, -h * 0.4, w + 12, 12);
    ctx.restore();
  }
}

function drawGround(sc) {
  ctx.beginPath(); ctx.moveTo(0, H);
  let minY = H;
  const pts = [];
  for (let sx = -6; sx <= W + 6; sx += 5) {
    const wx = cam.x + sx / sc, sy = (groundY(wx) - cam.y) * sc;
    pts.push(sx, sy); if (sy < minY) minY = sy; ctx.lineTo(sx, sy);
  }
  ctx.lineTo(W + 6, H); ctx.closePath();
  const g = ctx.createLinearGradient(0, Math.max(0, minY), 0, H + 200 * sc);
  g.addColorStop(0, "#f6cd88"); g.addColorStop(0.35, "#eab06a"); g.addColorStop(1, "#c07a3e");
  ctx.fillStyle = g; ctx.fill();
  // lit crest line
  ctx.beginPath();
  for (let i = 0; i < pts.length; i += 2) i ? ctx.lineTo(pts[i], pts[i + 1]) : ctx.moveTo(pts[i], pts[i + 1]);
  ctx.strokeStyle = "rgba(255,240,212,.85)"; ctx.lineWidth = Math.max(2, 4 * sc); ctx.stroke();
  // soft shadow on lee sides
  ctx.save(); ctx.globalAlpha = 0.12; ctx.strokeStyle = "#8a4f22"; ctx.lineWidth = 26 * sc;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i += 2) i ? ctx.lineTo(pts[i], pts[i + 1] + 16 * sc) : ctx.moveTo(pts[i], pts[i + 1] + 16 * sc);
  ctx.stroke(); ctx.restore();
}

function drawShards(sc, t) {
  for (const s of shards) {
    const [sx, sy] = toS(s.x, s.y + Math.sin(t * 3 + s.ph) * 6, sc);
    if (sx < -40 || sx > W + 40) continue;
    const r = 13 * sc + 3;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 3);
    g.addColorStop(0, "rgba(200,245,255,.8)"); g.addColorStop(1, "rgba(200,245,255,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r * 3, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(Math.sin(t * 2 + s.ph) * 0.3);
    ctx.fillStyle = "#e9fbff"; ctx.beginPath(); ctx.moveTo(0, -r * 1.3); ctx.lineTo(r * 0.7, 0); ctx.lineTo(0, r * 1.3); ctx.lineTo(-r * 0.7, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#7fd3ef"; ctx.beginPath(); ctx.moveTo(0, -r * 1.3); ctx.lineTo(r * 0.7, 0); ctx.lineTo(0, r * 1.3); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawPickups(sc, t) {
  for (const q of pickups) {
    const [sx, sy] = toS(q.x, q.y + Math.sin(t * 2.5 + q.ph) * 10, sc);
    if (sx < -60 || sx > W + 60) continue;
    const P = POWER[q.type], r = 22 * sc + 6;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 2.6);
    g.addColorStop(0, P.color + "cc"); g.addColorStop(1, P.color + "00");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r * 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = "#fffaf0"; ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = P.color; ctx.lineWidth = Math.max(2, 5 * sc); ctx.beginPath(); ctx.arc(sx, sy, r * (1 + 0.08 * Math.sin(t * 6)), 0, TAU); ctx.stroke();
    ctx.fillStyle = "#3b2a1c"; ctx.font = `700 ${r * 1.1}px Jost, system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(P.glyph, sx, sy + 1); ctx.textBaseline = "alphabetic";
  }
}

function drawOasis(sc) {
  const [sx] = toS(nextOasis, 0, sc);
  if (sx < -200 || sx > W + 200 || state === "menu") return;
  const [, sy] = toS(nextOasis, groundY(nextOasis), sc);
  ctx.save(); ctx.translate(sx, sy); ctx.scale(sc, sc);
  for (const [ox, h, lean] of [[-70, 230, -0.15], [60, 280, 0.12], [140, 190, 0.2]]) {
    ctx.strokeStyle = "#8a5a2e"; ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(ox, 10); ctx.quadraticCurveTo(ox + lean * h, -h * 0.5, ox + lean * h * 1.4, -h); ctx.stroke();
    ctx.fillStyle = "#3f8f55";
    for (let k = 0; k < 6; k++) { const ang = -Math.PI / 2 + (k - 2.5) * 0.55; ctx.save(); ctx.translate(ox + lean * h * 1.4, -h); ctx.rotate(ang); ctx.beginPath(); ctx.ellipse(38, 0, 42, 9, 0.25, 0, TAU); ctx.fill(); ctx.restore(); }
  }
  ctx.fillStyle = "rgba(127,211,239,.55)"; ctx.beginPath(); ctx.ellipse(20, 14, 150, 18, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#fff6e6"; ctx.font = "26px Marcellus, Georgia, serif"; ctx.textAlign = "center";
  ctx.fillText(`Oasis ${oasisN + 1}`, 20, -320);
  ctx.restore();
}

function drawTrail(sc) {
  if (trail.length < 2) return;
  const speed = Math.hypot(p.vx, p.vy), k = clamp((speed - 250) / 900, 0.15, 1);
  ctx.lineCap = "round";
  for (let i = 1; i < trail.length; i++) {
    const a = trail[i - 1], b = trail[i], f = i / trail.length;
    const [x1, y1] = toS(a.x, a.y, sc), [x2, y2] = toS(b.x, b.y, sc);
    const col = powers.gale > 0 ? "255,180,80" : fever > 0 ? "255,215,110" : powers.sky > 0 ? "205,170,255" : "190,235,255";
    ctx.strokeStyle = `rgba(${col},${f * 0.8 * (powers.gale > 0 || fever > 0 ? 1 : k)})`; ctx.lineWidth = (2 + f * (powers.gale > 0 ? 20 : 12)) * sc;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
}

function drawRider(sc) {
  // scarf (world space)
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = "#f6f0e2"; ctx.lineWidth = 7 * sc;
  ctx.beginPath();
  scarf.forEach((s, i) => { const [x, y] = toS(s.x, s.y, sc); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();

  const [sx, sy] = toS(p.x, p.y, sc);
  if (powers.ward > 0) { ctx.strokeStyle = "rgba(158,240,166,.7)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy - 28 * sc, 62 * sc, 0, TAU); ctx.stroke(); ctx.fillStyle = "rgba(158,240,166,.12)"; ctx.fill(); }
  ctx.save(); ctx.translate(sx, sy); ctx.scale(sc, sc); ctx.rotate(p.rot);
  const crouch = (hold && state === "play") || (state === "menu" && autoHold()) ? 6 : 0;

  // blade glow
  ctx.save(); ctx.shadowColor = "rgba(150,225,255,.95)"; ctx.shadowBlur = 18;
  ctx.fillStyle = "#bfeeff"; ctx.beginPath(); ctx.moveTo(-46, 1); ctx.lineTo(38, 1); ctx.lineTo(50, 2); ctx.lineTo(38, 5); ctx.lineTo(-46, 4); ctx.fill();
  ctx.restore();
  // blade
  const bg = ctx.createLinearGradient(0, -4, 0, 4);
  bg.addColorStop(0, "#fff1b8"); bg.addColorStop(0.5, "#e2b54e"); bg.addColorStop(1, "#a8762a");
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(-40, -3); ctx.lineTo(36, -3); ctx.lineTo(50, 1); ctx.lineTo(36, 4); ctx.lineTo(-40, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#8a5d22"; ctx.fillRect(-44, -8, 6, 16); ctx.fillRect(-52, -2, 8, 5);
  ctx.fillStyle = "#7fe0ff"; ctx.beginPath(); ctx.arc(-41, 0, 2.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(120,80,20,.5)"; ctx.lineWidth = 1;
  for (let k = -28; k < 30; k += 8) { ctx.beginPath(); ctx.moveTo(k, -1); ctx.lineTo(k + 4, -1); ctx.stroke(); }

  // legs
  ctx.strokeStyle = "#2d3a48"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-12, -3); ctx.lineTo(-9, -15 + crouch * 0.5); ctx.lineTo(-2, -24 + crouch); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11, -3); ctx.lineTo(10, -15 + crouch * 0.5); ctx.lineTo(3, -24 + crouch); ctx.stroke();
  // cloak
  const cg = ctx.createLinearGradient(-16, -50, 14, -10);
  cg.addColorStop(0, "#8fd0c4"); cg.addColorStop(0.5, "#3d8f88"); cg.addColorStop(1, "#24605e");
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(-3, -50 + crouch);
  ctx.quadraticCurveTo(-22, -32 + crouch, -24, -12 + crouch * 0.5);
  ctx.lineTo(-8, -18 + crouch); ctx.lineTo(14, -16 + crouch);
  ctx.quadraticCurveTo(12, -36 + crouch, 5, -50 + crouch);
  ctx.closePath(); ctx.fill();
  // arm reaching forward
  ctx.strokeStyle = "#3d8f88"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(3, -40 + crouch); ctx.lineTo(16, -32 + crouch); ctx.lineTo(22, -30 + crouch); ctx.stroke();
  // hood + head
  ctx.fillStyle = "#eef3ee"; ctx.beginPath(); ctx.arc(2, -56 + crouch, 8.5, 0, TAU); ctx.fill();
  ctx.fillStyle = "#c9d6cf"; ctx.beginPath(); ctx.arc(5, -55 + crouch, 5, -0.6, 1.4); ctx.fill();
  ctx.restore();
}

function drawParticles(sc) {
  for (const q of particles) {
    const [x, y] = toS(q.x, q.y, sc), a = q.life / q.max;
    ctx.fillStyle = q.color + (a * 0.9).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(x, y, q.size * sc * (0.6 + a * 0.6) + 0.5, 0, TAU); ctx.fill();
  }
}

function drawStorm(sc, t) {
  if (state === "menu") return;
  const fx = (storm.x - cam.x) * sc, depth = 520 * sc;
  if (fx + depth < 0) return;
  const g = ctx.createLinearGradient(fx - depth, 0, fx + depth * 0.6, 0);
  g.addColorStop(0, "rgba(118,74,44,.97)"); g.addColorStop(0.55, "rgba(160,104,62,.8)"); g.addColorStop(1, "rgba(190,130,80,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, Math.max(0, fx + depth * 0.6), H);
  // swirling grit
  ctx.strokeStyle = "rgba(240,200,150,.35)"; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 40; i++) {
    const yy = (hash(i * 4.1) * H + t * 260 * (0.5 + hash(i))) % H;
    const xx = fx - depth + ((hash(i * 7.7) * depth * 1.4 + t * 500) % (depth * 1.4));
    ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx + 20, yy - 10, xx + 50, yy + 6);
  }
  ctx.stroke();
}

function drawVignette() {
  if (state !== "play") return;
  const gap = p.x - storm.x;
  const danger = clamp(1 - (gap - 250) / 700, 0, 1);
  const dusk = clamp(1 - (gap - 300) / 1800, 0, 1);
  if (dusk > 0) { ctx.fillStyle = `rgba(35,30,70,${dusk * 0.32})`; ctx.fillRect(0, 0, W, H); }
  if (danger > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, "rgba(110,60,30,0)"); g.addColorStop(1, `rgba(110,60,30,${danger * 0.6})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255,236,210,${danger * (0.6 + 0.4 * Math.sin(performance.now() / 120))})`;
    ctx.font = `600 13px Jost, system-ui, sans-serif`; ctx.textAlign = "center";
    ctx.fillText("THE STORM IS CLOSE · HOLD ON DOWNHILLS, LET GO ON CLIMBS", W / 2, H - Math.max(28, H * 0.05));
  }
  if (flashT > 0) { ctx.fillStyle = `rgba(220,245,255,${flashT * 0.5})`; ctx.fillRect(0, 0, W, H); }
}

function drawPopups() {
  ctx.textAlign = "center";
  popups.forEach((pp, i) => {
    const a = pp.t < 0.15 ? pp.t / 0.15 : clamp(1 - (pp.t - 1.1) / 0.5, 0, 1);
    const y = H * 0.26 + i * 34 - pp.t * 12;
    ctx.font = `${pp.big ? 26 : 20}px Marcellus, Georgia, serif`;
    ctx.fillStyle = `rgba(80,45,20,${a * 0.35})`; ctx.fillText(pp.text, W / 2 + 1, y + 2);
    ctx.fillStyle = `rgba(255,250,238,${a})`; ctx.fillText(pp.text, W / 2, y);
  });
}

function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
  drawSky(t);
  drawMesas(0.08, "#e6c7ac", 520, 0);
  haze(0.35, H * 0.3);
  drawMesas(0.18, "#e4b88f", 430, 77);
  haze(0.22, H * 0.4);
  drawBgDunes();
  haze(0.12, H * 0.5);
  const sc = baseScale() * cam.zoom;
  drawRuins(sc);
  drawGround(sc);
  drawOasis(sc);
  drawShards(sc, t);
  drawPickups(sc, t);
  drawTrail(sc);
  drawParticles(sc);
  drawRider(sc);
  drawStorm(sc, t);
  drawVignette();
  drawPopups();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt);
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
